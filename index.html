<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#084b3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Al-Barakah" />
    <title>Al-Barakah Digital Manager</title>
    <meta name="description" content="Simple digital solution for daily shop transactions and accounting." />
    <meta property="og:title" content="Al-Barakah Digital Manager" />
    <meta property="og:description" content="Simple digital solution for daily shop transactions and accounting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
  </head>
  <body class="bg-[#f4f8f7]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #084b3e; color: white; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 64px; height: 64px; border-radius: 18px; background: white; padding: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
          <img src="/logo.png?v=2" alt="Al-Barakah Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 12px;" onerror="this.style.display='none'" />
        </div>
        <h1 style="font-size: 18px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: 0.5px;">
          Al-Barakah Digital Manager
        </h1>
        <p style="font-size: 12px; color: #a7f3d0; margin: 0 0 16px 0; font-weight: 500;">
          Al-Barakah Digital Studio & Online Service
        </p>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #e2e8f0;">
          <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #34d399; animation: pulse 1.5s infinite;"></span>
          <span>Loading store...</span>
        </div>
      </div>
    </div>
    <script>
      // Clean up stale service worker caches if running inside an iframe
      try {
        if ('serviceWorker' in navigator && (window.self !== window.top)) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        }
      } catch (e) {}

      window.addEventListener('error', function(e) {
        console.error('Al-Barakah error captured:', e.error || e.message);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
